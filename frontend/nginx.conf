server {
    listen 80;
    server_name localhost;

    # Planillas ITV ~15MB; default nginx = 1m → ERR_CONNECTION_RESET
    client_max_body_size 50m;
    client_body_timeout 120s;

    # Evita cortes en descargas lentas del bundle JS
    send_timeout 120s;
    keepalive_timeout 65s;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Assets con hash de Vite: caché larga + sin Range (evita 206 rotos)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        max_ranges 0;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # index.html no debe cachearse: apunta al hash actual del JS
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://parque_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering on;
    }

    location /health {
        proxy_pass http://parque_backend:8000/health;
    }
}
