<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Gestión de Parque Automotor - Viceministerio de Transporte, Paraguay" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Parque Automotor · VMT Paraguay</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('parque-theme')
          var theme = 'dark'
          if (raw) {
            var parsed = JSON.parse(raw)
            if (parsed && parsed.state && (parsed.state.theme === 'light' || parsed.state.theme === 'dark')) {
              theme = parsed.state.theme
            }
          }
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
